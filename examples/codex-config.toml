# Merge into your Codex config and replace all example paths.
# Reference: https://developers.openai.com/codex/mcp
[mcp_servers.imvu_studio]
command = 'C:\Your\Imvu-Studio-MCP\.venv\Scripts\python.exe'
args = [
  '-m', 'imvu_studio_mcp',
  '--project-root', 'C:\Your\IMVU Studio Projects',
  '--asset-root', 'C:\Your\Texture Sources',
  '--enable-ui', '--enable-writes',
]
startup_timeout_sec = 30
tool_timeout_sec = 45
